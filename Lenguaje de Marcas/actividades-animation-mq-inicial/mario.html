<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escena Super Mario Bros</title>
    <link rel="stylesheet" href="/actividades-animation-mq-inicial/css/mario.css"> 
</head>
<body>
    <div class="escena">
    <!-- Marcador superior -->
    <div class="hud">
      <div>MARIO<br>000000</div>
      <div><br>🪙 x00</div>
      <div>WORLD<br>1-1</div>
      <div>TIME<br>400</div>
    </div>

    <!-- Nubes -->
    <div class="nube nube-1"></div>
    <div class="nube nube-2"></div>

      <!-- Moneda -->
    <div class="moneda"></div>

    <!-- Bloques -->
    <div class="bloques">
      <div class="bloque ladrillo"></div>
      <div class="bloque sorpresa">?</div>
      <div class="bloque ladrillo"></div>
      <div class="bloque sorpresa">?</div>
      <div class="bloque ladrillo"></div>
    </div>

    <!-- Elementos del terreno -->
    <div class="arbusto"></div>

    <div class="tuberia">
      <!-- Personaje Mario -->
      <div class="mario">
        <div class="mario-gorra">
          <div class="mario-visera"></div>
        </div>
        <div class="mario-cabeza">
          <div class="mario-ojo"></div>
          <div class="mario-nariz"></div>
          <div class="mario-bigote"></div>
        </div>
        <div class="mario-cuerpo">
          <div class="mario-peto"></div>
        </div>
      </div>

      <div class="tuberia-boca"></div>
      <div class="tuberia-cuerpo"></div>
    </div>


    <!-- Suelo -->
    <div class="suelo"></div>
  </div>

</body>
</html>
